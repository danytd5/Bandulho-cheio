<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1A1208">
<title>BandulhoCheio — Entrar</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--cream:#F5F0E8;--dark:#1A1208;--terra:#C4622D;--gold:#D4A843;--olive:#5C6B3A;--sand:#E8D9C0;--muted:#7A6A52;--card:#FFFDF8}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--dark);font-family:"DM Sans",sans-serif;color:var(--dark)}
.screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:env(safe-area-inset-bottom)}
.sheet{background:var(--card);border-radius:24px 24px 0 0;padding:32px 24px 40px;width:100%;max-width:520px}
.logo-wrap{text-align:center;margin-bottom:6px}
.logo-wrap img{height:80px;width:80px;object-fit:contain}
.logo{font-family:"Playfair Display",serif;font-size:1.6rem;text-align:center;margin-bottom:4px}
.logo em{color:var(--terra);font-style:normal}
.tagline{text-align:center;color:var(--muted);font-size:.85rem;margin-bottom:28px}
.tabs{display:flex;background:var(--cream);border-radius:12px;padding:4px;margin-bottom:24px}
.tab{flex:1;padding:9px;border:none;background:transparent;border-radius:9px;font-family:"DM Sans",sans-serif;font-size:.88rem;font-weight:500;color:var(--muted);cursor:pointer;transition:.2s}
.tab.active{background:#fff;color:var(--dark);box-shadow:0 1px 4px rgba(0,0,0,.1)}
.field{margin-bottom:14px}
.field label{display:block;font-size:.78rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:6px}
.field input{width:100%;border:1.5px solid var(--sand);background:#fff;border-radius:12px;padding:13px 14px;font-family:"DM Sans",sans-serif;font-size:.95rem;outline:none;transition:.2s;-webkit-appearance:none}
.field input:focus{border-color:var(--terra)}
.btn-main{width:100%;background:var(--terra);color:#fff;border:none;border-radius:14px;padding:16px;font-family:"DM Sans",sans-serif;font-size:1rem;font-weight:600;cursor:pointer;margin-top:6px;transition:.2s}
.btn-main:active{background:#a84f22}
.btn-main:disabled{opacity:.6;cursor:not-allowed}
.msg{margin-top:14px;padding:12px;border-radius:10px;font-size:.85rem;text-align:center;display:none}
.msg.error{background:#FEE2E2;color:#991B1B;display:block}
.msg.success{background:#D1FAE5;color:#065F46;display:block}
.divider{text-align:center;color:var(--muted);font-size:.8rem;margin:16px 0}
</style>
</head>
<body>
<div class="screen">
  <div class="sheet">
    <div class="logo-wrap"><img src="logo.png" alt="BandulhoCheio" style="width:100%;max-width:320px;display:block;margin:0 auto"></div>
    <div class="logo">Bandulho<em>Cheio</em></div>
    <div class="tagline">O mapa dos melhores restaurantes de Portugal</div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Entrar</button>
      <button class="tab" onclick="switchTab('register')">Criar conta</button>
    </div>

    <div id="form-login">
      <div class="field"><label>Email</label><input type="email" id="login-email" placeholder="o_teu@email.com" autocomplete="email"></div>
      <div class="field"><label>Password</label><input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password"></div>
      <button class="btn-main" onclick="login()">Entrar</button>
      <div class="divider">— ou —</div>
      <button class="btn-main" style="background:var(--olive)" onclick="loginGoogle()">Entrar com Google</button>
    </div>

    <div id="form-register" style="display:none">
      <div class="field"><label>Email</label><input type="email" id="reg-email" placeholder="o_teu@email.com" autocomplete="email"></div>
      <div class="field"><label>Password</label><input type="password" id="reg-pass" placeholder="mínimo 6 caracteres" autocomplete="new-password"></div>
      <button class="btn-main" onclick="register()">Criar conta</button>
      <div class="divider">— ou —</div>
      <button class="btn-main" style="background:var(--olive)" onclick="loginGoogle()">Registar com Google</button>
    </div>

    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://lnoadcecdasvbhcbkkug.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imxub2FkY2VjZGFzdmJoY2Jra3VnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNjk5NjksImV4cCI6MjA5Njc0NTk2OX0.SChpCCjSZJTY0-2ZiiVhFop8QN20ZzOcw7Km6rxBHj4';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Já está logado? Vai direto para a app
sb.auth.getSession().then(({data:{session}})=>{
  if(session) checkAccessAndRedirect(session.user);
});

function switchTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active', (i===0&&tab==='login')||(i===1&&tab==='register')));
  document.getElementById('form-login').style.display = tab==='login'?'block':'none';
  document.getElementById('form-register').style.display = tab==='register'?'block':'none';
  showMsg('','');
}

function showMsg(text, type){
  const el=document.getElementById('msg');
  el.textContent=text;
  el.className='msg'+(type?' '+type:'');
}

async function login(){
  const email=document.getElementById('login-email').value.trim();
  const pass=document.getElementById('login-pass').value;
  if(!email||!pass){showMsg('Preenche todos os campos','error');return;}
  const btn=event.target; btn.disabled=true; btn.textContent='A entrar...';
  const {data,error}=await sb.auth.signInWithPassword({email,password:pass});
  btn.disabled=false; btn.textContent='Entrar';
  if(error){showMsg('Erro: '+error.message,'error');return;}
  showMsg('Login OK, a verificar perfil...','success');
  try {
    await checkAccessAndRedirect(data.user);
  } catch(e) {
    showMsg('Erro no redirect: '+e.message,'error');
  }
}

async function register(){
  const email=document.getElementById('reg-email').value.trim();
  const pass=document.getElementById('reg-pass').value;
  if(!email||!pass){showMsg('Preenche todos os campos','error');return;}
  if(pass.length<6){showMsg('Password deve ter mínimo 6 caracteres','error');return;}
  const btn=event.target; btn.disabled=true; btn.textContent='A criar conta...';
  const {data,error}=await sb.auth.signUp({email,password:pass});
  btn.disabled=false; btn.textContent='Criar conta';
  if(error){showMsg(error.message,'error');return;}
  // Create profile
  await sb.from('profiles').upsert({id:data.user.id, email:email});
  showMsg('Conta criada! Verifica o teu email para confirmar.','success');
}

async function loginGoogle(){
  await sb.auth.signInWithOAuth({provider:'google', options:{redirectTo: window.location.origin+'/app.html'}});
}



async function checkAccessAndRedirect(user){
  if(user.email === 'daniel.rg.santos@gmail.com'){
    window.location.href='admin.html';
    return;
  }
  const {data}=await sb.from('profiles').select('status').eq('id',user.id).maybeSingle();
  if(!data){
    await sb.from('profiles').insert({id:user.id, email:user.email, status:'inactive'});
    window.location.href='plans.html';
    return;
  }
  if(data.status==='active'){
    window.location.href='app.html';
  } else {
    window.location.href='plans.html';
  }
}
</script>
</body>
</html>
