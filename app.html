<style>
:root{
  --cream:#F5F0E8;--dark:#1A1208;--terra:#C4622D;--gold:#D4A843;
  --olive:#5C6B3A;--sand:#E8D9C0;--muted:#7A6A52;--card:#FFFDF8;
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--dark)}
body{font-family:"DM Sans",sans-serif;color:var(--dark);display:flex;flex-direction:column}

/* PAYWALL */
#paywall{position:fixed;inset:0;z-index:3000;background:rgba(26,18,8,.95);display:flex;align-items:flex-end;justify-content:center}
.pw-sheet{background:var(--card);border-radius:24px 24px 0 0;padding:32px 24px calc(32px + var(--safe-bottom));width:100%;max-width:520px;animation:slideUp .35s cubic-bezier(.25,.8,.25,1)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.pw-handle{width:40px;height:4px;background:var(--sand);border-radius:2px;margin:0 auto 20px}
.pw-logo{font-family:"Playfair Display",serif;font-size:1.6rem;color:var(--dark);text-align:center;margin-bottom:4px}
.pw-logo em{color:var(--terra);font-style:normal}
.pw-sub{text-align:center;color:var(--muted);font-size:.88rem;margin-bottom:20px}
.pw-price{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:20px}
.pw-amount{background:var(--terra);color:#fff;border-radius:100px;padding:8px 20px;font-size:1.3rem;font-weight:700}
.pw-period{font-size:.85rem;color:var(--muted)}
.pw-feats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px}
.pw-feat{background:var(--cream);border-radius:12px;padding:10px 12px;font-size:.8rem;color:var(--dark);display:flex;align-items:center;gap:6px}
.pw-feat::before{content:"✓";color:var(--olive);font-weight:700;flex-shrink:0}
.btn-sub{width:100%;background:var(--terra);color:#fff;border:none;border-radius:14px;padding:17px;font-family:"DM Sans",sans-serif;font-size:1rem;font-weight:600;cursor:pointer;letter-spacing:.2px;margin-bottom:8px}
.btn-demo{width:100%;background:transparent;border:1.5px solid var(--sand);color:var(--muted);border-radius:14px;padding:14px;font-family:"DM Sans",sans-serif;font-size:.9rem;cursor:pointer}
.btn-plan{width:100%;background:var(--olive);color:#fff;border:none;border-radius:14px;padding:14px;font-family:"DM Sans",sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-plan:active{background:#4a5730}
.btn-save{background:var(--gold);color:var(--dark);font-size:.7rem;font-weight:700;padding:2px 8px;border-radius:100px}

/* HEADER */
header{background:var(--dark);padding:calc(12px + var(--safe-top)) 16px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-family:"Playfair Display",serif;font-size:1.15rem;color:var(--gold)}
.logo em{color:var(--cream);font-style:normal}
.h-right{display:flex;align-items:center;gap:8px}
.h-count{font-size:.7rem;font-weight:600;color:rgba(255,255,255,.5)}
.h-btn{background:rgba(255,255,255,.1);border:none;color:var(--cream);border-radius:8px;padding:6px 12px;font-family:"DM Sans",sans-serif;font-size:.8rem;cursor:pointer}

/* TAB BAR */
.tabs{display:flex;background:var(--dark);border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.tab{flex:1;padding:10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border:none;background:transparent;color:rgba(255,255,255,.4);font-family:"DM Sans",sans-serif;font-size:.68rem;font-weight:500;transition:.2s;position:relative}
.tab.active{color:var(--terra)}
.tab.active::after{content:"";position:absolute;bottom:0;left:20%;right:20%;height:2px;background:var(--terra);border-radius:2px 2px 0 0}
.tab-icon{font-size:1.1rem}

/* SEARCH BAR */
.search-bar{background:var(--dark);padding:10px 16px 12px;flex-shrink:0}
.search-wrap{position:relative}
.search-input{width:100%;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.12);border-radius:12px;padding:11px 16px 11px 40px;font-family:"DM Sans",sans-serif;font-size:.92rem;color:#fff;outline:none;-webkit-appearance:none}
.search-input::placeholder{color:rgba(255,255,255,.35)}
.search-input:focus{border-color:var(--terra);background:rgba(255,255,255,.13)}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:.95rem;pointer-events:none;opacity:.5}
.search-clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,.15);border:none;border-radius:50%;width:20px;height:20px;color:#fff;font-size:.7rem;cursor:pointer;display:none;align-items:center;justify-content:center}
.search-clear.show{display:flex}

/* CHIPS */
.chips{padding:0 16px 12px;display:flex;gap:8px;overflow-x:auto;flex-shrink:0;background:var(--dark)}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:7px 14px;border-radius:100px;font-family:"DM Sans",sans-serif;font-size:.78rem;font-weight:500;cursor:pointer;border:1.5px solid rgba(255,255,255,.15);color:rgba(255,255,255,.6);background:transparent;transition:.2s;white-space:nowrap}
.chip.active{background:var(--terra);border-color:var(--terra);color:#fff}

/* LIST VIEW */
#view-list{flex:1;overflow-y:auto;background:var(--cream);-webkit-overflow-scrolling:touch}
#view-list::-webkit-scrollbar{display:none}
.card{background:var(--card);border-bottom:1px solid var(--sand);padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.1s;active:background:#FFF3EE}
.card:active{background:#FFF3EE}
.card-dot{width:10px;height:10px;border-radius:50%;background:var(--terra);flex-shrink:0}
.card-body{flex:1;min-width:0}
.card-name{font-family:"Playfair Display",serif;font-size:.95rem;font-weight:700;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-loc{font-size:.76rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-arrow{color:var(--sand);font-size:.9rem;flex-shrink:0}
.card-reg{font-size:.65rem;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--terra);margin-bottom:2px}
.list-header{padding:10px 16px;font-size:.75rem;color:var(--muted);font-weight:500;background:var(--cream);border-bottom:1px solid var(--sand);position:sticky;top:0;z-index:10;background:rgba(245,240,232,.95);backdrop-filter:blur(6px)}
.no-res{padding:48px 24px;text-align:center;color:var(--muted)}
.no-res-icon{font-size:2.5rem;margin-bottom:12px}
.no-res p{font-size:.9rem;line-height:1.6}

/* MAP VIEW */
#view-map{flex:1;position:relative;display:none}
#map{width:100%;height:100%}

/* BOTTOM SHEET (detail) */
#sheet{position:fixed;bottom:0;left:0;right:0;z-index:1000;background:var(--card);border-radius:20px 20px 0 0;padding:0 0 calc(16px + var(--safe-bottom));box-shadow:0 -8px 40px rgba(0,0,0,.2);transform:translateY(100%);transition:transform .3s cubic-bezier(.25,.8,.25,1);max-height:85vh;overflow-y:auto}
#sheet.open{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;background:var(--sand);border-radius:2px;margin:12px auto 16px}
.sheet-close{position:absolute;top:14px;right:16px;background:var(--sand);border:none;border-radius:50%;width:28px;height:28px;cursor:pointer;font-size:.85rem;color:var(--muted);display:flex;align-items:center;justify-content:center}
.sheet-content{padding:0 20px 8px}
.s-region{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--terra);margin-bottom:4px}
.s-name{font-family:"Playfair Display",serif;font-size:1.4rem;font-weight:700;line-height:1.2;margin-bottom:6px}
.s-city{font-size:.85rem;color:var(--muted);margin-bottom:16px}
.s-address{font-size:.82rem;color:var(--muted);background:var(--cream);border-radius:10px;padding:10px 12px;margin-bottom:16px;line-height:1.5}
.btn-maps{width:100%;background:var(--terra);color:#fff;border:none;border-radius:14px;padding:16px;font-family:"DM Sans",sans-serif;font-size:.95rem;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-maps:active{background:#a84f22}

/* Leaflet custom */
.pin{width:12px;height:12px;background:var(--terra);border:2.5px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(196,98,45,.5)}
.pin.sel{background:var(--gold);width:16px;height:16px;border-width:3px}
.leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.15);border:1px solid var(--sand);font-family:"DM Sans",sans-serif}
.leaflet-popup-content{margin:14px 16px;font-size:.85rem}
.p-name{font-family:"Playfair Display",serif;font-size:1rem;font-weight:700;margin-bottom:2px}
.p-city{color:var(--muted);font-size:.78rem;margin-bottom:8px}
.p-btn{background:var(--terra);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-family:"DM Sans",sans-serif;font-size:.8rem;font-weight:500;cursor:pointer;width:100%}
</style>

</head>

let filtered=[...ALL], activeRegion='', activeId=null;
let map=null, markerLayer=null, markers=[];
let currentTab='list';

// Haversine distance in km
function distKm(lat1,lng1,lat2,lng2){
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

let cityCenter=null; // {lat, lng} se pesquisa de cidade detetada

function haversineKm(lat1,lng1,lat2,lng2){
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLng=(lng2-lng1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}

function applyFilters(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  document.getElementById('clearBtn').classList.toggle('show', q.length>0);

  // Detectar se a pesquisa é uma cidade (hits de cidade > hits de nome)
  cityCenter = null;
  if(q.length>=3){
    const nameHits = ALL.filter(r=>r.name.toLowerCase().includes(q));
    const cityHits = ALL.filter(r=>(r.city||'').toLowerCase().includes(q)||(r.address||'').toLowerCase().includes(q));
    // É pesquisa de cidade se há mais matches de localização do que de nome
    if(cityHits.length > nameHits.length){
      const pts = cityHits.filter(r=>r.lat&&r.lng);
      if(pts.length){
        cityCenter = {
          lat: pts.reduce((s,r)=>s+r.lat,0)/pts.length,
          lng: pts.reduce((s,r)=>s+r.lng,0)/pts.length
        };
      }
    }
  }

  // filtered = lista para a sidebar (só os que correspondem à pesquisa)
  filtered = ALL.filter(r=>{
    const regionOk = !activeRegion || r.region===activeRegion;
    if(!q) return regionOk;
    const nameMatch = r.name.toLowerCase().includes(q);
    const locMatch  = (r.city||'').toLowerCase().includes(q)||(r.address||'').toLowerCase().includes(q);
    return regionOk && (nameMatch||locMatch);
  });

  document.getElementById('hcount').textContent = filtered.length.toLocaleString('pt')+' restaurantes';

  if(currentTab==='list') renderList();
  else renderMarkers();

  // Se detetámos uma cidade, zoom para ela no mapa
  if(cityCenter && map){
    map.setView([cityCenter.lat, cityCenter.lng], 12, {animate:true});
  } else if(cityCenter && currentTab==='list'){
    // Mudar para o mapa automaticamente quando pesquisa cidade
    switchTab('map');
    setTimeout(()=>{ if(map) map.setView([cityCenter.lat,cityCenter.lng],12,{animate:true}); },400);
  }
}

function setRegion(el, reg){
  activeRegion=reg;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  el.classList.add('active');
  applyFilters();
  if(currentTab==='map' && map){
    const pts=filtered.filter(r=>r.lat&&r.lng).map(r=>[r.lat,r.lng]);
    if(pts.length) map.fitBounds(pts,{padding:[40,40],maxZoom:12});
  }
}

function clearSearch(){
  document.getElementById('q').value='';
  document.getElementById('clearBtn').classList.remove('show');
  applyFilters();
}

function renderList(){
  const body=document.getElementById('listBody');
  const hdr=document.getElementById('listHeader');
  hdr.textContent=filtered.length.toLocaleString('pt')+' restaurantes encontrados';
  if(!filtered.length){
    body.innerHTML='<div class="no-res"><div class="no-res-icon">🍽️</div><p>Nenhum restaurante encontrado.<br>Tenta outra pesquisa.</p></div>';
    return;
  }
  body.innerHTML=filtered.map(r=>`
    <div class="card" onclick="showDetail(${r.id})">
      <div class="card-dot"></div>
      <div class="card-body">
        <div class="card-reg">${r.region}</div>
        <div class="card-name">${r.name}</div>
        <div class="card-loc">📍 ${r.city}${r.address?' · '+(r.address.split(',').slice(-2,-1)[0]||'').trim():''}</div>
      </div>
      <div class="card-arrow">›</div>
    </div>
  `).join('');
}

function initMap(){
  if(map) return;
  loadLeaflet(function(){
    map=L.map('map',{center:[39.5,-8],zoom:7,zoomControl:true});
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
      attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:19
    }).addTo(map);
    markerLayer=L.layerGroup().addTo(map);
    renderMarkers();
  });
}

function renderMarkers(){
  if(!map||!markerLayer) return;
  markerLayer.clearLayers();
  markers=[];
  // SEMPRE mostra todos os restaurantes no mapa (sem filtro de região/pesquisa)
  // Destaca os que estão a <=20km do centro da cidade pesquisada
  const allPins = ALL.filter(r=>r.lat&&r.lng);
  allPins.forEach(r=>{
    let isHighlight, pinColor, pinSize, zOffset=0;
    if(cityCenter){
      const km = haversineKm(cityCenter.lat,cityCenter.lng,r.lat,r.lng);
      isHighlight = km <= 20;
      pinColor  = isHighlight ? '#C4622D' : 'rgba(160,130,100,0.35)';
      pinSize   = isHighlight ? '12px' : '7px';
      zOffset   = isHighlight ? 100 : 0;
    } else {
      // Sem pesquisa de cidade: destaca os da região/filtro ativa, resto mais suave
      const inFilter = filtered.some(f=>f.id===r.id);
      pinColor  = inFilter ? '#C4622D' : 'rgba(160,130,100,0.35)';
      pinSize   = inFilter ? '11px' : '7px';
      zOffset   = inFilter ? 100 : 0;
    }
    if(activeId===r.id){ pinColor='#D4A843'; pinSize='14px'; }
    const icon=L.divIcon({
      className:'',
      html:`<div style="width:${pinSize};height:${pinSize};background:${pinColor};border:2px solid #fff;border-radius:50%;box-shadow:0 2px 6px rgba(0,0,0,0.25);transition:.2s"></div>`,
      iconSize:[14,14],iconAnchor:[7,7]
    });
    const m=L.marker([r.lat,r.lng],{icon, zIndexOffset:zOffset});
    m.on('click',()=>showDetail(r.id));
    m.rid=r.id;
    markerLayer.addLayer(m);
    markers.push(m);
  });
}

function switchTab(tab){
  currentTab=tab;
  document.getElementById('tab-list').classList.toggle('active',tab==='list');
  document.getElementById('tab-map').classList.toggle('active',tab==='map');
  document.getElementById('view-list').style.display=tab==='list'?'block':'none';
  document.getElementById('view-map').style.display=tab==='map'?'block':'none';
  if(tab==='map') initMap();
}

function showDetail(id){
  const r=ALL.find(x=>x.id===id);
  if(!r) return;
  activeId=id;
  document.getElementById('sheetContent').innerHTML=`
    <div class="s-region">${r.region}</div>
    <div class="s-name">${r.name}</div>
    <div class="s-city">📍 ${r.city}</div>
    ${r.address?`<div class="s-address">${r.address}</div>`:''}
    ${r.url?`<button class="btn-maps" onclick="window.open('${r.url}','_blank')">🗺️ Abrir no Google Maps</button>`:''}
  `;
  document.getElementById('sheet').classList.add('open');
  if(currentTab==='map'&&r.lat&&r.lng&&map){
    map.setView([r.lat,r.lng],15,{animate:true});
  }
}

function closeSheet(){
  document.getElementById('sheet').classList.remove('open');
  activeId=null;
}

// Swipe down to close sheet
let startY=0;
document.getElementById('sheet').addEventListener('touchstart',e=>{startY=e.touches[0].clientY},{passive:true});
document.getElementById('sheet').addEventListener('touchend',e=>{
  if(e.changedTouches[0].clientY-startY>60) closeSheet();
},{passive:true});

function closePaywall(){document.getElementById('paywall').style.display='none';}
// Stripe links integrados nos botões

// Init
setTimeout(function(){ applyFilters(); }, 0);
</script>
